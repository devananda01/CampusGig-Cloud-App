<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Post a New Gig — CampusGig</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
    </head>
    <body>
        <div id="navbar"></div>

        <div id="sidebarContainer"></div>

        <div class="form-page">
            <a href="my-tasks.html" class="back-link">
                <span class="material-symbols-outlined">arrow_back</span>
                Back to Tasks
            </a>

            <div class="form-page-header">
                <h1 id="pageTitle">Post a New Gig</h1>
                <p id="pageSubtitle">
                    Reach out to skilled students for your project. Fill out the details below to attract the best
                    applicants.
                </p>
            </div>

            <form id="createTaskForm" novalidate>
                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label" for="title">Title</label>
                        <div class="input-field">
                            <input
                                type="text"
                                id="title"
                                name="title"
                                maxlength="100"
                                placeholder="e.g. Graphic Design for Student Event"
                            />
                        </div>
                        <p id="titleError" class="error-message"></p>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="category">Category</label>
                            <div class="input-field has-select">
                                <select id="category" name="category">
                                    <option value="" disabled selected hidden>Select a Category</option>
                                    <option value="Design">Design</option>
                                    <option value="Web Development">Web Development</option>
                                    <option value="Writing">Writing</option>
                                    <option value="Documentation">Documentation</option>
                                    <option value="Other">Others</option>
                                </select>
                            </div>
                            <p id="categoryError" class="error-message"></p>
                        </div>
                        <div class="form-group hidden" id="otherCategoryGroup">
                            <label class="form-label" for="otherCategory">New Category</label>

                            <div class="input-field">
                                <input
                                    type="text"
                                    id="otherCategory"
                                    maxlength="50"
                                    placeholder="Enter a new category"
                                />
                            </div>

                            <p id="otherCategoryError" class="error-message"></p>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="budget">Budget (Est.)</label>
                            <div class="input-field has-prefix">
                                <span class="prefix">$</span>
                                <input type="number" id="budget" name="budget" placeholder="0.00" min="0" step="0.01" />
                            </div>
                            <p id="budgetError" class="error-message"></p>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="location">Location</label>
                            <div class="input-field">
                                <input
                                    type="text"
                                    id="location"
                                    name="location"
                                    maxlength="100"
                                    placeholder="e.g. Online, or On Campus — Student Union, Room 204"
                                />
                            </div>
                            <p id="locationError" class="error-message"></p>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="applicationDeadline">Deadline Date</label>
                            <div class="input-field">
                                <input type="date" id="applicationDeadline" name="application_deadline" />
                            </div>
                            <p id="deadlineError" class="error-message"></p>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="durationValue"> Estimated Duration </label>

                        <div class="form-row">
                            <div class="input-field">
                                <input type="number" id="durationValue" min="1" placeholder="2" />
                            </div>

                            <div class="input-field has-select">
                                <select id="durationUnit">
                                    <option value="min">Minutes</option>
                                    <option value="hr" selected>Hours</option>
                                    <option value="day">Days</option>
                                </select>
                            </div>
                        </div>

                        <p id="durationError" class="error-message"></p>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label" for="description">Description</label>
                        <textarea
                            class="form-textarea"
                            id="description"
                            name="description"
                            maxlength="1000"
                            placeholder="Describe the requirements, deliverables, and any specific skills needed..."
                            style="min-height: 180px"
                        ></textarea>
                        <p id="descriptionError" class="error-message"></p>
                    </div>
                </div>

                <div class="form-submit-row">
                    <button id="createTaskBtn" type="submit" class="btn btn-dark">Post Task</button>
                </div>
            </form>
        </div>
<div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/common.js"></script>
        <script src="js/create-task.js"></script>

        <script>
            requireLogin();
            initializePage();
        </script>
    </body>
</html>
