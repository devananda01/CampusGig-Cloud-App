<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Posted Tasks — CampusGig</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
    </head>
    <body>
        <div id="navbar"></div>

        <div id="sidebarContainer"></div>

        <main class="dashboard-main">
            <div class="page-heading-row">
                <h1 class="page-heading">My Posted Tasks</h1>
                <a href="create-task.html" class="btn btn-dark">
                    <span class="material-symbols-outlined">add</span>
                    Create Task
                </a>
            </div>

            <div id="loadingState" class="loading-state">Loading tasks...</div>

            <div class="table-card">
                <table class="applications-table">
                    <thead>
                        <tr>
                            <th>Task Details</th>
                            <th>Status</th>
                            <th>Applicants</th>
                            <th>Budget</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state hidden">
                <span class="material-symbols-outlined">work_off</span>
                <h3>No tasks found</h3>
                <p>You haven't posted any tasks yet.</p>
            </div>
        </main>

        <div id="deleteModal" class="modal-overlay">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title">
                <div class="modal-header">
                    <h2 id="delete-modal-title">Confirm Delete</h2>
                    <button id="closeDeleteBtn" class="modal-close" aria-label="Close">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <p>Are you sure you want to delete this Task?</p>
                <div class="modal-actions">
                    <button id="cancelDeleteBtn" class="btn btn-neutral">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn btn-dark">Delete Task</button>
                </div>
            </div>
        </div>
        <div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/common.js"></script>
        <script src="js/my-tasks.js"></script>

        <script>
            requireLogin();
            initializePage();
        </script>
    </body>
</html>
