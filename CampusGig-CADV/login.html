<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Login - CampusGig</title>

        <link rel="stylesheet" href="css/style.css" />

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>

    <body style="background-color: rgba(0, 0, 0, 0.3)">
        <main class="auth-page">
            <div class="auth-card">
                <p class="auth-logo">Campus<span>Gig</span></p>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email"> School Email </label>

                        <div class="input-field">
                            <span class="material-symbols-outlined"> mail </span>

                            <input type="email" id="email" placeholder="student@university.edu" />
                        </div>

                        <p id="emailError" class="error-message"></p>
                    </div>

                    <div class="form-group">
                        <label class="form-label password-label" for="password">
                            <span>Password</span>

                            <a href="forgot-password.html"> Forgot Password? </a>
                        </label>

                        <div class="input-field">
                            <span class="material-symbols-outlined"> lock </span>

                            <input type="password" id="password" placeholder="••••••••" />
                        </div>

                        <p id="passwordError" class="error-message"></p>
                    </div>

                    <p id="loginError" class="error-message"></p>

                    <button type="submit" class="btn btn-dark btn-block">Log In</button>

                    <hr class="form-divider" />

                    <p class="form-footnote">
                        Don't have an account?
                        <a href="register.html">Register</a>
                    </p>
                </form>
            </div>
        </main>
<div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/common.js"></script>
        <script src="js/login.js"></script>
    </body>
</html>
