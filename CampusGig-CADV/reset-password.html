<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Password - CampusGig</title>

        <link rel="stylesheet" href="css/style.css" />

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>

    <body>
        <main class="auth-page">
            <div class="auth-card">
                <p class="auth-logo">Campus<span>Gig</span></p>

                <div id="resetFormSection">
                    <h1 class="auth-heading">Reset Password</h1>

                    <p class="auth-description">Create a new password for your CampusGig account.</p>

                    <form id="resetPasswordForm">
                        <div class="form-group">
                            <label class="form-label" for="newPassword"> New Password </label>

                            <div class="input-field">
                                <span class="material-symbols-outlined"> lock </span>

                                <input type="password" id="newPassword" placeholder="••••••••" />
                            </div>

                            <p id="passwordError" class="error-message"></p>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="confirmPassword"> Confirm Password </label>

                            <div class="input-field">
                                <span class="material-symbols-outlined"> lock </span>

                                <input type="password" id="confirmPassword" placeholder="••••••••" />
                            </div>

                            <p id="confirmPasswordError" class="error-message"></p>
                        </div>

                        <p id="resetPasswordError" class="error-message"></p>

                        <button type="submit" class="btn btn-dark btn-block">Reset Password</button>

                        <hr class="form-divider" />

                        <p class="form-footnote">
                            Remembered your password?
                            <a href="login.html">Log In</a>
                        </p>
                    </form>
                </div>

                <div id="successSection" class="hidden">
                    <span class="material-symbols-outlined success-icon"> check_circle </span>

                    <h1 class="auth-heading">Password Reset</h1>

                    <p class="auth-description">Your password has been updated successfully.</p>

                    <a href="login.html" class="btn btn-dark btn-block"> Log In </a>
                </div>
            </div>
        </main>
        <div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/reset-password.js"></script>
    </body>
</html>
