<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Forgot Password - CampusGig</title>

        <link rel="stylesheet" href="css/style.css" />

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>

    <body>
        <main class="auth-page">
            <div class="auth-card">
                <p class="auth-logo">Campus<span>Gig</span></p>

                <h1 class="auth-heading">Forgot Password</h1>

                <p class="auth-description">Enter your school email and we'll send you a verification code.</p>

                <form id="forgotPasswordForm">
                    <div class="form-group">
                        <label class="form-label" for="email"> School Email </label>

                        <div class="input-field">
                            <span class="material-symbols-outlined"> mail </span>

                            <input type="email" id="email" placeholder="student@tp.edu.sg" />
                        </div>

                        <p id="emailError" class="error-message"></p>
                    </div>

                    <p id="forgotPasswordError" class="error-message"></p>

                    <button type="submit" class="btn btn-dark btn-block">Send Verification Code</button>

                    <hr class="form-divider" />

                    <p class="form-footnote">
                        Remembered your password?
                        <a href="login.html">Log In</a>
                    </p>
                </form>
            </div>
        </main>

        <!-- Verification Modal -->

        <div id="verificationModal" class="verification-modal hidden">
            <div class="verification-modal-content">
                <h2>Verification Code</h2>

                <p class="auth-description">Enter the 6-digit verification code sent to your email.</p>

                <div class="form-group">
                    <input type="text" id="verificationCode" maxlength="6" placeholder="123456" />

                    <p id="verificationError" class="error-message"></p>
                </div>

                <div class="modal-actions">
                    <button id="continueBtn" class="btn btn-dark" type="button">Continue</button>

                    <button id="resendBtn" class="btn btn-outline" type="button">Resend Code</button>
                </div>
            </div>
        </div>
        <div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/forgot-password.js"></script>
    </body>
</html>
