<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Applications — CampusGig</title>
        <link rel="stylesheet" href="css/style.css" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
    </head>
    <body>
        <div id="navbar"></div>

        <div id="sidebarContainer"></div>

        <main class="dashboard-main">
            <div class="page-heading-row">
                <h1 class="page-heading">My Applications</h1>
            </div>

            <div id="loadingState" class="loading-state">Loading applications...</div>

            <div id="tableContainer" class="table-card">
                <table class="applications-table">
                    <thead>
                        <tr>
                            <th>Task ID</th>
                            <th>Status</th>
                            <th>Applied On</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicationTableBody"></tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state hidden">
                <span class="material-symbols-outlined">work_off</span>
                <h3>No applications found</h3>
                <p>You haven't applied for any tasks yet.</p>
            </div>
        </main>

        <div id="withdrawModal" class="modal-overlay hidden">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="withdraw-modal-title">
                <div class="modal-header">
                    <h2 id="withdraw-modal-title">Withdraw Application</h2>
                    <button id="closeWithdrawBtn" class="modal-close" aria-label="Close">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <p>Are you sure you want to withdraw this application?</p>
                <div class="modal-actions">
                    <button id="cancelWithdrawBtn" class="btn btn-neutral">Cancel</button>
                    <button id="confirmWithdrawBtn" class="btn btn-dark">Withdraw</button>
                </div>
            </div>
        </div>
        <div id="editModal" class="modal-overlay hidden">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
                <div class="modal-header">
                    <h2 id="edit-modal-title">Edit Application</h2>

                    <button id="closeEditBtn" class="modal-close" type="button">
                        <span class="material-symbols-outlined"> close </span>
                    </button>
                </div>

                <div class="form-group">
                    <label class="form-label"> Application Message </label>

                    <textarea id="editApplicationMessage" class="form-textarea" rows="6"></textarea>

                    <p id="editApplicationError" class="error-message"></p>
                </div>

                <div class="modal-actions">
                    <button id="cancelEditBtn" class="btn btn-neutral" type="button">Cancel</button>

                    <button id="saveEditBtn" class="btn btn-dark" type="button">Save Changes</button>
                </div>
            </div>
        </div>
<div id="toastContainer" class="toast-container"></div>
        <script src="js/config.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/common.js"></script>
        <script src="js/my-applications.js"></script>

        <script>
            requireLogin();
            initializePage();
        </script>
    </body>
</html>
